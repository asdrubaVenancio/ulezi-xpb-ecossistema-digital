version: '3.8'

services:
  # Base de dados MySQL
  db:
    image: mysql:8.0
    container_name: ulezi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ulezi_root_2026
      MYSQL_DATABASE: ulezi2_xpb
      MYSQL_USER: ulezi_user
      MYSQL_PASSWORD: ulezi_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulezi-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ulezi_user
      DB_PASSWORD: ulezi_pass_2026
      DB_NAME: ulezi2_xpb
      JWT_SECRET: ulezi_xpb_jwt_secret_change_this_in_production
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ulezi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api

volumes:
  mysql_data:
